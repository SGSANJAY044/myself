---
layout: default
title: Blog
permalink: /blog/
---
<h1>blog</h1>
<p class="lede">Notes from building stuff. Mostly lessons, some rants.</p>

<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <a href="{{ post.url | relative_url }}">
      <span class="date">{{ post.date | date: "%b %-d, %Y" }}</span>
      <span>{{ post.title }}</span>
    </a>
  </li>
  {% else %}
  <li>Nothing yet. Soon.</li>
  {% endfor %}
</ul>
