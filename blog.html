---
layout: default
title: Blog
permalink: /blog/
---
<h1>blog</h1>
<p class="lede">Notes from building stuff. Mostly lessons, some rants.</p>

<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <span class="date">{{ post.date | date: "%b %-d, %Y" }}</span>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
  </li>
  {% else %}
  <li>Nothing yet. Soon.</li>
  {% endfor %}
</ul>
